[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recuris"
version = "0.1.0"
description = "Evaluation and evolution code for Recuris: validation-gated Skill Memory for frozen agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["llm-agents", "skill-memory", "agent-memory", "benchmark", "self-improvement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# The kernel itself is deliberately thin: a Skill Memory package is YAML plus
# Markdown, and the runtime is pure Python. Everything heavier belongs to an
# extra, so that scoring a results directory you already have needs no
# benchmark, no Docker and no model client.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# tau2-Bench arms. The benchmark itself is fetched by third_party/tau2/setup.sh
# and is not a Python dependency of this package.
tau2 = [
  "pydantic>=2.0",
  "numpy>=1.24",
]
# The recursive evolution loop.
metaagent = [
  "pydantic>=2.0",
  "numpy>=1.24",
  "openai>=1.40",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# SkillFlow arms. harbor is the runner that executes the containerised
# tasks; third_party/harbor/harbor-0.20.0-docker.patch targets this exact
# version, and it is the one the reported numbers were produced with.
skillflow = [
  "jinja2>=3.1",
  "harbor==0.20.0",
]
# Terminal-Bench 2.1 test-time adaptation, also run through harbor.
tb21 = [
  "jinja2>=3.1",
  "harbor==0.20.0",
]
dev = [
  "ruff>=0.6",
  "numpy>=1.24",
  "pydantic>=2.0",
]
all = [
  "recuris[tau2,metaagent,skillflow,tb21,dev]",
]

[project.scripts]
recuris = "recuris.cli:main"

[project.urls]
Source = "https://github.com/Gen-Verse/Recuris"

[tool.hatch.build.targets.wheel]
packages = ["src/recuris"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/configs",
  "/skill_memories",
  "/splits",
  "/integrity",
  "/scripts",
  "/docs",
  "/third_party",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Deliberately no "UP" rules. Modernising type annotations across the campaign
# driver would mean thousands of edits to code that produced published numbers,
# and this release does not restructure that code.
select = ["E", "F", "W", "I", "B"]
ignore = [
  "E501",   # long lines are a formatting matter, not a lint error
  "E402",   # deferred imports are intentional: benchmark modules load lazily
  "B008",   # call in an argument default is idiomatic for the argparse builders
  "B905",   # zip(strict=) would change behaviour in code we are not rewriting
]

