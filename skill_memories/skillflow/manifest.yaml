# !!! ADAPTER IS EXTERNAL — NOT A tau2 CoreLoop AGENT !!!
# This bench's agent is NoInstallQwenCode (SkillFlow/libs/harbor_noinstall_agents/agents.py),
# a containerized QwenCode CLI driven by ONE rendered prompt — there is no per-turn harness
# loop, so the tau2 builtins named below (standing_inject / need_driven_retrieval / checkers)
# DO NOT bind automatically. The wm/delivery mapping is realized by the EXTERNAL wiring:
#   - templates/sf-<family>.j2 (generated by skiller-framework/tools/gen_skillflow_templates.py)
#     injected via the harbor QwenCode `prompt_template_path` kwarg
#     (SkillFlow/run_skillflow_skill_arm.sh, jobs land under jobs/sfm-*);
#   - MACHINE.md = standing machine card (always-on prefix in every template);
#   - ROUTER.md signals + card SOURCE families = per-family card selection (audit trail:
#     templates/MAPPING.md);
#   - WM = contract ledger: the template's WORKING-MEMORY DIRECTIVE makes the agent write
#     CONTRACT.md (enumerate graded items), then RE-OPEN artifacts from disk and assert
#     each item before finishing — model-maintained, machine-enforced (no harness state
#     is possible in a one-shot CLI run; see docs/DESIGN_WM_env_interaction_2026-07-07_CN.md §4).
# Every stanza below is validation-pending until the no-mem vs skill smoke (§6.4 of
# HANDOFF_TB_SkillFlow_2026-07-07_CN.md) and the GPQA-protocol leakage audit pass.

name: skillflow
status: validation-pending

wm:
  # ASPIRATIONAL tau2 vocabulary; realized as the contract-ledger directive (see header).
  entry_kind: generic_item        # contract item = (graded assertion, PASS/FAIL)
  manager: blueprint_then_delta   # CONTRACT.md first, assert-and-fix loop last
  schema:
    max_entries: 40               # graded items per task can be dozens (cells/keys/literals)

delivery:
  - use: standing_inject          # -> MACHINE.md prefix in every template
    cfg: { em_type: machine }
  - use: need_driven_retrieval    # -> ROUTER/SOURCE family matching at template-generation time
    cfg: { em_types: [cards], granularity: family, audit: templates/MAPPING.md }

checkers:
  - use: pre_submit_contract_assert   # -> the re-open-and-assert loop inside MACHINE/WM directive
    cfg: { evidence: reopened-file, fail_policy: fix-then-reassert }

gate:
  lines: all_pending              # every contract item must be asserted before finishing

leakage_audit:
  protocol: gpqa                  # held-out flip + force-inject + leakage ablation
  status: PENDING
  high_risk_cards: [C1, C3, C4, C15]   # grader-internals adjacency — adjudicate before formal eval
